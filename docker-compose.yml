version: '3.8'

services:
  # Main B2B Sales Backend Application
  b2b-sales-backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    expose:
      - "3001"
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/b2b_sales
      
      # AI Service Configuration
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_EMBEDDING_ENDPOINT=${AZURE_EMBEDDING_ENDPOINT}
      - AZURE_EMBEDDING_API_KEY=${AZURE_EMBEDDING_API_KEY}
      
      # ElevenLabs Configuration
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      
      # Elasticsearch Configuration
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_SCHEME=http
      
      # Application Configuration
      - API_HOST=0.0.0.0
      - API_PORT=3001
      - DEBUG=true
      - USE_HYBRID_RETRIEVER=true
      - FORCE_RELOAD_DATA=false
      - SKIP_DATA_LOADING=false
      
      # CORS Configuration
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      
      # New Relic Configuration
      - NEWRELIC_ENABLED=True
      - NEWRELIC_LICENSE_KEY=${NEWRELIC_LICENSE_KEY}
      - NEWRELIC_APP_NAME=B2B Sales Backend
      - NEWRELIC_ENVIRONMENT=production
      - NEWRELIC_DISABLE_FOR_ELASTICSEARCH=True
      - ENABLE_RESPONSE_CACHING=True
      - CACHE_TTL=300
      - MAX_CONCURRENT_REQUESTS=100
      - REQUEST_TIMEOUT=30
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=b2b_sales
      - DB_ECHO_SQL=False
      - CONVERSATION_HISTORY_LIMIT=20
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX_PRODUCTS=products
      - ELASTICSEARCH_INDEX_SOLUTIONS=solutions
      - CHROMA_DB_PATH=./chroma_db
      - CHROMA_MAX_ITEMS_PER_FILE=50
      - DATA_DIR=Data/json
      - DEFAULT_AI_PROVIDER=azure_openai
      - AZURE_OPENAI_API_VERSION=2025-01-01-preview
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - AZURE_EMBEDDING_DEPLOYMENT_NAME=${AZURE_EMBEDDING_DEPLOYMENT_NAME}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - HUGGINGFACE_MODEL=microsoft/DialoGPT-medium
      - ELEVENLABS_VOICE_ID=pNInz6obpgDQGcFmaJgB
      - ELEVENLABS_MODEL_ID=eleven_multilingual_v2
      - ELEVENLABS_STT_MODEL_ID=scribe_v1
      - ELEVENLABS_STABILITY=0.5
      - ELEVENLABS_SIMILARITY_BOOST=0.5
      - ELEVENLABS_STYLE=0.0
      - ELEVENLABS_USE_SPEAKER_BOOST=True
      - SPEECH_PRIMARY_PROVIDER=elevenlabs
      - SPEECH_FALLBACK_ENABLED=True
      - SPEECH_TTS_PRIMARY_RETRIES=1
      - ELASTICSEARCH_WEIGHT=0.4
      - SEMANTIC_WEIGHT=0.6
      - USE_RRF_MERGING=True
      - RRF_K=60.0
      - RRF_ELASTICSEARCH_WEIGHT=0.5
      - RRF_SEMANTIC_WEIGHT=0.5
      - MAX_SEARCH_RESULTS_PER_SOURCE=50
      - FINAL_RESULT_LIMIT=20
      
    volumes:
      # Persist logs
      - ./logs:/app/logs
      # Persist admin configuration (prompts, data sources)
      - ./Data/admin_config:/app/Data/admin_config
      # Persist uploaded data
      - ./Data/uploads:/app/Data/uploads
      # Persist generated quotes and pitch decks
      - ./Data/quotes:/app/Data/quotes
      - ./Data/pitch_decks:/app/Data/pitch_decks
      # Persist JSON data files
      - ./Data/json:/app/Data/json
      # Note: ChromaDB volume removed - using Elasticsearch for all search functionality
      - ./chroma_db:/app/chroma_db
      # Persist New Relic configuration
      - ./newrelic.ini:/app/newrelic.ini
    depends_on:
      - postgres
      - elasticsearch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: b2b_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize with extensions
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for Product Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx2g"
      - bootstrap.memory_lock=true
      - indices.memory.index_buffer_size=30%
      - indices.queries.cache.size=20%
      - thread_pool.search.queue_size=1000
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana for Elasticsearch Management (Optional)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped
    profiles:
      - monitoring

  # Adminer for Database Management (Optional)
  adminer:
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  default:
    name: b2b-sales-network