services:
  # Main B2B Sales Backend Application
  b2b-sales-backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    expose:
      - "3001"
    env_file:
      - ../.env
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/b2b_sales

      # AI Service Configuration
      #- AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      #- AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      #- AZURE_EMBEDDING_ENDPOINT=${AZURE_EMBEDDING_ENDPOINT}
      #- AZURE_EMBEDDING_API_KEY=${AZURE_EMBEDDING_API_KEY}
      
      # ElevenLabs Configuration
      #- ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      
      # Elasticsearch Configuration
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_SCHEME=http

      # Application Configuration
      - API_HOST=0.0.0.0
      - API_PORT=3001
      - DEBUG=true
      - USE_HYBRID_RETRIEVER=true
      - FORCE_RELOAD_DATA=false
      - SKIP_DATA_LOADING=false
      - PYTHONUNBUFFERED=1 

      # CORS Configuration
      - CORS_ORIGINS=http://74.176.202.10:3000,http://74.176.202.10:3001,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      
    volumes:
      # Persist logs
      # - ./logs:/app/logs
      # Persist admin configuration (prompts, data sources)
      - ./Data/admin_config:/app/Data/admin_config
      - ./Data/uploads:/app/Data/uploads
      - ./Data/quotes:/app/Data/quotes
      - ./Data/pitch_decks:/app/Data/pitch_decks
      - ./Data/json:/app/Data/json
      # Note: ChromaDB volume removed - using Elasticsearch for all search functionality
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - b2b-sales-network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: b2b_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize with extensions only - tables will be created by SQLAlchemy
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b2b-sales-network

  # Elasticsearch for Product Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx2g"
      - bootstrap.memory_lock=true
      - indices.memory.index_buffer_size=30%
      - indices.queries.cache.size=20%
      - thread_pool.search.queue_size=1000
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://74.176.202.10:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b2b-sales-network

  # Kibana for Elasticsearch Management (Optional)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - b2b-sales-network

  # Adminer for Database Management (Optional)
  adminer:
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - b2b-sales-network

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  b2b-sales-network:
    driver: bridge
  