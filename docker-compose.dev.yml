version: '3.8'

services:
  # Main B2B Sales Backend Application (Development)
  b2b-sales-backend:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    expose:
      - "3001"
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/b2b_sales
      
      # AI Service Configuration
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_EMBEDDING_ENDPOINT=${AZURE_EMBEDDING_ENDPOINT}
      - AZURE_EMBEDDING_API_KEY=${AZURE_EMBEDDING_API_KEY}
      
      # ElevenLabs Configuration
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      
      # Elasticsearch Configuration
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_SCHEME=http
      
      # Application Configuration
      - API_HOST=0.0.0.0
      - API_PORT=3001
      - DEBUG=true
      - USE_HYBRID_RETRIEVER=true
      - FORCE_RELOAD_DATA=false
      - SKIP_DATA_LOADING=false
      
      # Performance Configuration for Development
      - MAX_CONCURRENT_REQUESTS=50
      - REQUEST_TIMEOUT=30
      - ENABLE_RESPONSE_CACHING=true
      - CACHE_TTL=300
      - CONVERSATION_HISTORY_LIMIT=10
      - DB_ECHO_SQL=true
      
      # CORS Configuration
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      
    volumes:
      # Persist logs
      - ./logs:/app/logs
      # Persist admin configuration (prompts, data sources)
      - ./Data/admin_config:/app/Data/admin_config
      # Persist uploaded data
      - ./Data/uploads:/app/Data/uploads
      # Persist generated quotes and pitch decks
      - ./Data/quotes:/app/Data/quotes
      - ./Data/pitch_decks:/app/Data/pitch_decks
      # Persist JSON data files
      - ./Data/json:/app/Data/json
      # Mount source code for hot reload
      - .:/app
    depends_on:
      - postgres
      - elasticsearch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: b2b_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/usr/share/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for Product Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1g"
      - bootstrap.memory_lock=true
      - indices.memory.index_buffer_size=30%
      - indices.queries.cache.size=20%
      - thread_pool.search.queue_size=500
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  default:
    name: b2b-sales-network-dev 