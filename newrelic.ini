# New Relic Python Agent Configuration File
# This file configures the New Relic Python agent for the B2B Sales Backend

[newrelic]
# Application name - this will appear in the New Relic dashboard
app_name = B2B Sales Backend

# License key - replace with your actual New Relic license key
license_key = YOUR_NEW_RELIC_LICENSE_KEY

# Log level for the agent
log_level = info

# Enable distributed tracing
distributed_tracing.enabled = true

# Enable browser monitoring
browser_monitoring.auto_instrument = true

# Enable transaction tracer
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
transaction_tracer.explain_enabled = true
transaction_tracer.explain_threshold = 0.5

# Enable error collector
error_collector.enabled = true
error_collector.record_errors = true
error_collector.ignore_errors = 

# Enable thread profiler
thread_profiler.enabled = true

# Enable datastore tracer
datastore_tracer.database_name_reporting.enabled = true
datastore_tracer.instance_reporting.enabled = true

# Enable external services monitoring
external_service_tracer.enabled = true

# Enable background task monitoring
background_task.enabled = true

# Enable function tracer
function_tracer.enabled = true

# Enable memory profiler
memory_profiler.enabled = true

# Enable code level metrics
code_level_metrics.enabled = true

# Custom attributes
attributes.include = request.parameters.*, request.headers.*, response.headers.*

# High security mode (disable if not needed)
high_security = false

# SSL verification
ssl = true

# Proxy settings (if needed)
# proxy_host = 
# proxy_port = 
# proxy_user = 
# proxy_pass = 

# Exclude Elasticsearch client methods from instrumentation to prevent async issues
transaction_tracer.function_trace = 
    elasticsearch.AsyncElasticsearch.*:False
    elasticsearch.client.AsyncElasticsearch.*:False
    elastic_transport.*:False

# Custom instrumentation
# Add any custom instrumentation here if needed

# Environment-specific settings
# For production
[production]
app_name = B2B Sales Backend (Production)
log_level = warning

# For staging/development
[development]
app_name = B2B Sales Backend (Development)
log_level = info
debug = true

# For testing
[testing]
app_name = B2B Sales Backend (Testing)
log_level = debug
debug = true 