version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/app

jobs:
  build:
    executor: python-executor
    environment:
      # Application Configuration
      API_HOST: "0.0.0.0"
      API_PORT: "3001"
      DEBUG: "true"
      USE_HYBRID_RETRIEVER: "true"
      FORCE_RELOAD_DATA: "false"
      
      # CORS Configuration
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001"
      
      # Database Configuration
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/b2b_sales"
      
      # Elasticsearch Configuration
      ELASTICSEARCH_HOST: "elasticsearch"
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: "http"
      ELASTICSEARCH_WEIGHT: "0.4"
      
      # AI Service Configuration
      DEFAULT_AI_PROVIDER: "azure_openai"
      AZURE_OPENAI_API_VERSION: "2025-01-01-preview"
      AZURE_OPENAI_DEPLOYMENT_NAME: "gpt-4.1-mini"
      AZURE_EMBEDDING_DEPLOYMENT_NAME: "text-embedding-3-large"
      # ChromaDB Configuration
      CHROMA_DB_PATH: "/app/chroma_db"
      CHROMA_MAX_ITEMS_PER_FILE: "50"
      SEMANTIC_WEIGHT: "0.6"
      
      # Data Configuration
      DATA_DIR: "Data/json"
      SKIP_DATA_LOADING: "false"
      
      # ElevenLabs Configuration
      ELEVENLABS_API_KEY: "your-elevenlabs-api-key"
      ELEVENLABS_VOICE_ID: "pNInz6obpgDQGcFmaJgB"
      ELEVENLABS_MODEL_ID: "eleven_multilingual_v2"
      ELEVENLABS_STT_MODEL_ID: "eleven_multilingual_v1"
      ELEVENLABS_STABILITY: "0.5"
      ELEVENLABS_SIMILARITY_BOOST: "0.5"
      ELEVENLABS_STYLE: "0.0"
      ELEVENLABS_USE_SPEAKER_BOOST: "true"
      
      # Speech Service Configuration
      SPEECH_PRIMARY_PROVIDER: "elevenlabs"
      SPEECH_FALLBACK_ENABLED: "true"
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and run docker-compose
          command: |
            docker-compose -f docker-compose.yml up --build -d
      - run:
          name: List files in /app
          command: |
            docker exec app-b2b-sales-backend-1 ls -l /app
      - run:
          name: Show files in CI context
          command: |
            ls -l
            find . -name main.py

  deploy:
    executor: python-executor
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:EQxGGD9fpAsUzA3Bzl7eyDu2H/muW2OdrrTc3IvfHHE"  # Replace with your actual fingerprint from CircleCI
      - run:
          name: Debug environment variables
          command: |
            echo "AZURE_VM_HOST: $AZURE_VM_HOST"
            echo "AZURE_VM_USER: $AZURE_VM_USER"
            echo "Testing SSH connectivity..."
            ssh-keyscan -T 10 $AZURE_VM_HOST || echo "ssh-keyscan failed, but continuing..."
      - run:
          name: Debug SSH key setup
          command: |
            echo "Checking SSH agent and keys..."
            ssh-add -l || echo "No keys in SSH agent"
            echo "Testing SSH connection with verbose output..."
            ssh -v -o ConnectTimeout=10 -o StrictHostKeyChecking=no $AZURE_VM_USER@$AZURE_VM_HOST echo "SSH test successful" || echo "SSH connection failed"
      - run:
          name: Add Azure VM to known hosts
          command: |
            ssh-keyscan -H -T 30 $AZURE_VM_HOST >> ~/.ssh/known_hosts || {
              echo "ssh-keyscan failed, trying with IP resolution..."
              nslookup $AZURE_VM_HOST || echo "DNS lookup failed"
              exit 1
            }
      - run:
          name: Deploy to Azure VM
          command: |
            # Connect to Azure VM and deploy
            ssh $AZURE_VM_USER@$AZURE_VM_HOST \<< 'EOF'
              cd ~/b2b-sales-backend
              
              # Pull latest changes from git
              git fetch origin
              git checkout master
              git reset --hard origin/master
              
              # Copy environment file if it doesn't exist
              if [ ! -f .env ]; then
                cp docker.env.example .env
                echo "Please update .env with production values!"
              fi
              
              # Stop existing containers
              docker compose down
              
              # Build and start new containers
              docker compose up --build -d
              
              # Wait for services to be ready before setting up nginx
              echo "Waiting for services to be ready..."
              sleep 30
              
              # Setup nginx reverse proxy
              if [ -f setup-nginx-proxy.sh ]; then
                echo "Setting up nginx reverse proxy..."
                chmod +x setup-nginx-proxy.sh
                ./setup-nginx-proxy.sh install
              else
                echo "Warning: setup-nginx-proxy.sh not found, skipping nginx setup"
              fi
              
              # Clean up old images and volumes
              docker image prune -f
              docker volume prune -f
              
              # Show final status
              echo "Deployment completed. Checking service status..."
              ./setup-nginx-proxy.sh status || echo "Nginx status check failed"
            EOF


workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master 
 
